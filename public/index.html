    <!-- Service Worker Registration & Update Detection -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            if (reg.waiting) {
              window.dispatchEvent(new CustomEvent('lq-sw-update-available'));
            }
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('lq-sw-update-available'));
                  }
                });
              }
            });
          }).catch(function() {});
        });
      }
    </script>

      .tag { border: 0 !important; background: transparent !important; padding: 0 !important; font: 600 11px/1.3 'Plus Jakarta Sans', sans-serif !important; letter-spacing: .08em !important; text-transform: uppercase !important; color: var(--mu) !important; display: inline !important; }
      .tag-sep { color: var(--dim); margin: 0 4px; user-select: none; display: inline-block; }

      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .art { background: var(--art); border: 1px solid var(--hl); border-radius: var(--r); display: flex; align-items: center; justify-content: center; color: var(--mu); text-align: center; padding: 0; aspect-ratio: 16/9; width: 100%; overflow: hidden; position: relative; }
      .old { font: 400 13px 'Plus Jakarta Sans', sans-serif; color: var(--mu); text-decoration: line-through; }
      .free { font: 700 13px 'Plus Jakarta Sans', sans-serif; letter-spacing: .04em; }
      .rule { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hl); }
      .sec { border-top: 1px solid var(--hl); padding: 32px 0 56px; }
      .sec > .m { margin-bottom: 20px; display: block; }
      .grid { display: grid; gap: 28px 24px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
      .card { display: block; min-width: 0; cursor: pointer; }
      .card .t { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin: 12px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card .row { flex-wrap: nowrap; }
      .card .row > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hero { display: grid; grid-template-columns: 44% 56%; gap: 48px; padding: 32px 0 48px; }
      .cd { display: flex; gap: 40px; margin: 24px 0; }
      .cd b { display: block; font: 700 clamp(44px, 6vw, 84px)/1 'Plus Jakarta Sans', sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
      .hot b { color: var(--time); }
      .bar { height: 2px; background: var(--hl); }
      .bar i { display: block; height: 2px; background: var(--tx); }
      .hot .bar i { background: var(--time); }
      .big { font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
      .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; padding: 40px 0 56px; align-items: start; }
      .tabs { display: flex; gap: 24px; overflow-x: auto; margin-bottom: 24px; }
      .claimed { font: 600 13px 'Plus Jakarta Sans', sans-serif; color: var(--mu); }
      .sw { width: 44px; height: 26px; border-radius: 13px; background: var(--hl); border: 1px solid var(--bd); position: relative; cursor: pointer; flex: none; padding: 0; }
      .sw i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--mu); transition: left .15s ease; }
      .sw[aria-checked=true] { background: var(--tx); }
      .sw[aria-checked=true] i { left: 21px; background: #000; }
      .inp { background: none; border: 0; border-bottom: 1px solid var(--bd); color: var(--tx); font: 400 16px 'Plus Jakarta Sans', sans-serif; padding: 8px 0; width: 100%; outline: none; }
      .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); gap: 48px; padding: 24px 0 56px; align-items: start; }
      .cols > * { min-width: 0; }
      footer { border-top: 1px solid var(--hl); padding: 28px 0; }
      @media(max-width: 900px) {
        .hero, .cols, .layout { grid-template-columns: 1fr; gap: 32px; }
        .wrap { padding: 0 20px; }
        .cd { gap: 24px; }
